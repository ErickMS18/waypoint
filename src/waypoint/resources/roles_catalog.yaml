# Catalog of target roles. Order matters: a job title is assigned to the FIRST role
# whose title_include matches (so specific roles like MLOps come before generic ones).
# Titles are matched after lowercasing and removing accents.
roles:
  mlops_engineer:
    label: MLOps Engineer
    summary: Coloca modelos de machine learning em produção e mantém eles funcionando.
    description: 'Cuida da "esteira" dos modelos: empacota, faz deploy, automatiza treino e versões, monitora desempenho e drift em produção e
      garante que tudo seja reproduzível e escalável. Fica entre ciência de dados e engenharia de software/infraestrutura.'
    day_to_day:
    - Montar pipelines de treino e deploy (CI/CD para modelos)
    - Servir modelos via API e containers (Docker, Kubernetes)
    - Monitorar modelos em produção (latência, drift, qualidade)
    - Versionar dados, modelos e experimentos (MLflow etc.)
    typical_skills:
    - Python
    - Docker
    - Kubernetes
    - CI/CD
    - MLflow
    - AWS/GCP/Azure
    - monitoramento
    search_terms:
    - mlops engineer
    - machine learning platform engineer
    - engenheiro de mlops
    - mlops
    title_include:
    - \bml ?ops\b
    - \b(ml|machine learning|ai)\b.{0,10}\b(platform|infrastructure|infra|ops)\b.{0,15}\b(engineer|engenheir[oa])\b
    title_exclude:
    - \b(director|diretor[a]?|vp|vice president|head of|manager|gerente)\b
    summary_en: Puts machine learning models into production and keeps them working.
    description_en: 'Owns the model "assembly line": packaging, deployment, automated training and versioning, monitoring performance and drift
      in production, and keeping everything reproducible and scalable. Sits between data science and software/infrastructure engineering.'
    day_to_day_en:
    - Build training and deployment pipelines (CI/CD for models)
    - Serve models through APIs and containers (Docker, Kubernetes)
    - Monitor models in production (latency, drift, quality)
    - Version data, models and experiments (MLflow etc.)
    typical_skills_en:
    - Python
    - Docker
    - Kubernetes
    - CI/CD
    - MLflow
    - AWS/GCP/Azure
    - monitoring
  analytics_engineer:
    label: Analytics Engineer
    summary: Transforma dados brutos em modelos limpos e confiáveis para análise.
    description: 'Faz a ponte entre engenharia de dados e análise: modela tabelas (camadas, fatos e dimensões), escreve transformações em SQL/dbt,
      documenta métricas e testa a qualidade dos dados para que analistas e BIs usem uma única fonte da verdade.'
    day_to_day:
    - Modelar dados em camadas (staging, intermediária, marts)
    - Escrever e testar transformações em SQL/dbt
    - Definir e documentar métricas de negócio
    - Garantir qualidade e governança dos dados
    typical_skills:
    - SQL
    - dbt
    - modelagem de dados
    - data warehouse
    - Git
    - qualidade de dados
    - BI
    search_terms:
    - analytics engineer
    - engenheiro de analytics
    - analytics engineering
    title_include:
    - \banalytics engineer
    - \bengenheir[oa] de analytics\b
    title_exclude:
    - \b(director|diretor[a]?|vp|vice president|head of|manager|gerente)\b
    summary_en: Turns raw data into clean, trustworthy models for analysis.
    description_en: 'Bridges data engineering and analytics: models tables (layers, facts and dimensions), writes SQL/dbt transformations, documents
      metrics and tests data quality so analysts and BI share a single source of truth.'
    day_to_day_en:
    - Model data in layers (staging, intermediate, marts)
    - Write and test SQL/dbt transformations
    - Define and document business metrics
    - Ensure data quality and governance
    typical_skills_en:
    - SQL
    - dbt
    - data modeling
    - data warehouse
    - Git
    - data quality
    - BI
  bi_analyst:
    label: BI Developer / BI Analyst
    summary: Constrói dashboards e modelos de BI que ajudam a empresa a decidir.
    description: Entende a necessidade das áreas de negócio, modela os dados para relatórios, cria dashboards (Power BI, Tableau, Looker), escreve
      DAX/SQL e mantém indicadores confiáveis e atualizados. Na versão Developer, pesa mais a parte técnica (modelagem, ETL, performance).
    day_to_day:
    - Levantar requisitos com as áreas de negócio
    - Modelar dados e criar medidas (DAX/SQL)
    - Desenvolver e manter dashboards e relatórios
    - Cuidar de cargas, performance e governança dos BIs
    typical_skills:
    - Power BI
    - DAX
    - SQL
    - modelagem dimensional
    - ETL
    - Excel
    - comunicação
    search_terms:
    - bi developer
    - bi analyst
    - business intelligence analyst
    - analista de bi
    - desenvolvedor power bi
    - analista de business intelligence
    title_include:
    - \b(bi|business intelligence|power ?bi)\b.{0,25}\b(developer|analyst|engineer|specialist|consultant|analista|desenvolvedor[a]?|engenheir[oa]|especialista|consultor[a]?)\b
    - \b(analista|desenvolvedor[a]?|especialista|consultor[a]?|engenheir[oa])\b.{0,20}\b(bi|business intelligence|power ?bi)\b
    title_exclude:
    - \b(director|diretor[a]?|vp|vice president|head of|manager|gerente|coordenador[a]?)\b
    - \b(sales|vendas|account|comercial)\b
    summary_en: Builds dashboards and BI models that help the company decide.
    description_en: Understands what business teams need, models data for reporting, builds dashboards (Power BI, Tableau, Looker), writes DAX/SQL
      and keeps indicators reliable and up to date. The Developer flavor leans more technical (modeling, ETL, performance).
    day_to_day_en:
    - Gather requirements with business teams
    - Model data and write measures (DAX/SQL)
    - Build and maintain dashboards and reports
    - Own refreshes, performance and BI governance
    typical_skills_en:
    - Power BI
    - DAX
    - SQL
    - dimensional modeling
    - ETL
    - Excel
    - communication
  ai_ml_engineer:
    label: AI/ML Engineer (LLM/GenAI)
    summary: Constrói produtos e sistemas com modelos de IA, hoje muito com LLMs.
    description: 'Desenvolve soluções com machine learning e IA generativa: integra LLMs, monta RAG e agentes, avalia a qualidade das respostas
      e leva isso para produção com boas práticas de software. É um cargo de engenharia: código de produção pesa tanto quanto o modelo.'
    day_to_day:
    - Integrar LLMs e APIs de IA em produtos
    - Construir RAG, agentes e ferramentas
    - Criar avaliações (evals) de qualidade
    - Colocar modelos e serviços em produção
    typical_skills:
    - Python
    - LLMs
    - RAG
    - agentes
    - avaliação de LLMs
    - APIs
    - cloud
    - MLOps
    search_terms:
    - machine learning engineer
    - ai engineer
    - llm engineer
    - engenheiro de machine learning
    - engenheiro de ia
    title_include:
    - \b(machine learning|ml)\b.{0,30}\b(engineer|engineering|engenheir[oa]|developer|desenvolvedor[a]?|specialist|especialista)\b
    - \b(ai|ia|genai|gen ai|llm|applied ai|generative ai|inteligencia artificial)\b.{0,30}\b(engineer|engenheir[oa]|developer|desenvolvedor[a]?|specialist|especialista)\b
    - \b(engenheir[oa]|desenvolvedor[a]?)\b.{0,25}\b(machine learning|ia|inteligencia artificial|ml)\b
    title_exclude:
    - \b(sales|vendas|account executive|recruit\w*|marketing|legal|counsel|product manager|designer)\b
    - \b(director|diretor[a]?|vp|vice president|head of|manager|gerente)\b
    - \b(support|suporte|solutions? (engineer|architect)|arquitet[oa] de solu\w+)\b
    summary_en: Builds products and systems with AI models — today, a lot of LLMs.
    description_en: 'Develops machine learning and generative AI solutions: integrates LLMs, builds RAG and agents, evaluates answer quality and
      ships it to production with solid software practices. It is an engineering role: production code matters as much as the model.'
    day_to_day_en:
    - Integrate LLMs and AI APIs into products
    - Build RAG, agents and tools
    - Create quality evaluations (evals)
    - Ship models and services to production
    typical_skills_en:
    - Python
    - LLMs
    - RAG
    - agents
    - LLM evaluation
    - APIs
    - cloud
    - MLOps
  data_scientist:
    label: Data Scientist
    summary: Usa estatística e machine learning para responder perguntas e prever coisas.
    description: 'Investiga dados para gerar respostas e previsões: testes A/B, modelos preditivos, séries temporais, inferência causal. Traduz
      resultados em decisões para o negócio, então comunicação e estatística são tão importantes quanto o código.'
    day_to_day:
    - Explorar dados e formular hipóteses
    - Treinar e avaliar modelos preditivos
    - Desenhar e analisar experimentos (A/B)
    - Apresentar conclusões para o negócio
    typical_skills:
    - Python
    - SQL
    - estatística
    - machine learning
    - testes A/B
    - comunicação
    search_terms:
    - data scientist
    - cientista de dados
    title_include:
    - \bdata scien(tist|ce)\b
    - \bcientista de dados\b
    - \bciencia de dados\b
    - \b(applied|decision) scientist\b
    title_exclude:
    - \b(director|diretor[a]?|vp|vice president|head of|manager|gerente)\b
    - \b(professor|teacher|instructor|tutor)\b
    summary_en: Uses statistics and machine learning to answer questions and predict things.
    description_en: 'Investigates data to produce answers and forecasts: A/B tests, predictive models, time series, causal inference. Translates
      results into business decisions, so communication and statistics matter as much as code.'
    day_to_day_en:
    - Explore data and form hypotheses
    - Train and evaluate predictive models
    - Design and analyze experiments (A/B)
    - Present conclusions to the business
    typical_skills_en:
    - Python
    - SQL
    - statistics
    - machine learning
    - A/B testing
    - communication
  data_analyst:
    label: Data Analyst
    summary: Analisa dados para explicar o que aconteceu e acompanhar indicadores.
    description: 'Responde perguntas do negócio com dados: consultas SQL, planilhas, dashboards e análises descritivas. É a porta de entrada mais
      comum na área de dados.'
    day_to_day:
    - Escrever consultas SQL e montar bases de análise
    - Criar relatórios e dashboards
    - Acompanhar KPIs e explicar variações
    - Apoiar decisões das áreas com números
    typical_skills:
    - SQL
    - Excel
    - Power BI/Tableau
    - Python
    - estatística básica
    - comunicação
    search_terms:
    - data analyst
    - analista de dados
    title_include:
    - \bdata analyst\b
    - \banalista de dados\b
    title_exclude:
    - \b(director|diretor[a]?|vp|head of|manager|gerente)\b
    summary_en: Analyzes data to explain what happened and track indicators.
    description_en: 'Answers business questions with data: SQL queries, spreadsheets, dashboards and descriptive analysis. The most common entry
      point into the data field.'
    day_to_day_en:
    - Write SQL queries and build analysis datasets
    - Create reports and dashboards
    - Track KPIs and explain changes
    - Support team decisions with numbers
    typical_skills_en:
    - SQL
    - Excel
    - Power BI/Tableau
    - Python
    - basic statistics
    - communication
  data_engineer:
    label: Data Engineer
    summary: Constrói e mantém os pipelines que levam os dados até quem precisa deles.
    description: 'Projeta a infraestrutura de dados: ingestão, pipelines (batch e streaming), data lakes e warehouses, orquestração e performance.
      Garante que os dados cheguem completos, no prazo e com qualidade.'
    day_to_day:
    - Construir pipelines de ingestão e transformação
    - Orquestrar cargas (Airflow etc.)
    - Modelar data lakes/warehouses
    - Monitorar qualidade, custos e performance
    typical_skills:
    - Python
    - SQL
    - Spark
    - Airflow
    - cloud
    - modelagem de dados
    - Kafka
    search_terms:
    - data engineer
    - engenheiro de dados
    title_include:
    - \bdata engineer
    - \bengenheir[oa] de dados\b
    title_exclude:
    - \b(director|diretor[a]?|vp|head of|manager|gerente)\b
    summary_en: Builds and maintains the pipelines that deliver data to whoever needs it.
    description_en: 'Designs data infrastructure: ingestion, batch and streaming pipelines, data lakes and warehouses, orchestration and performance.
      Makes sure data arrives complete, on time and with quality.'
    day_to_day_en:
    - Build ingestion and transformation pipelines
    - Orchestrate loads (Airflow etc.)
    - Model data lakes/warehouses
    - Monitor quality, cost and performance
    typical_skills_en:
    - Python
    - SQL
    - Spark
    - Airflow
    - cloud
    - data modeling
    - Kafka
