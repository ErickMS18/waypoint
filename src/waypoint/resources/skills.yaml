# Canonical skill taxonomy used to normalize what the LLM extracts and by the
# dictionary baseline. id: stable key | name: display name | cat: category
# aliases: case-insensitive whole-word matches (PT and EN) | regex: extra pattern
# effort: rough hours to reach "usable in a project" level (for plan estimates)
categories:
  language: Programming languages
  ml: Machine learning
  dl: Deep learning
  genai: GenAI / LLMs
  nlp: NLP
  cv: Computer vision
  stats: Statistics & experimentation
  data: Data processing & engineering
  db: Databases
  cloud: Cloud
  mlops: MLOps & deployment
  eng: Software engineering
  bi: BI & visualization
  math: Math
  spoken: Spoken languages
  soft: Soft skills

