# Cargos-alvo.
# Os cargos disponíveis (com descrição, termos de busca e filtros de título) ficam em
# src/waypoint/resources/roles_catalog.yaml. Aqui você só escolhe quais estão ativos.
# Pela interface (aba "Cargos") dá para ligar/desligar e criar cargos personalizados;
# essas escolhas vão para config/targets.local.yaml, que fica fora do Git.

roles_enabled:
  - ai_ml_engineer
  - data_scientist
  - bi_analyst
  - analytics_engineer
  - mlops_engineer

# Cargos personalizados (mesmo formato do catálogo). Ex.:
# custom_roles:
#   prompt_engineer:
#     label: "Prompt Engineer"
#     search_terms: [prompt engineer]
#     title_include: ['\bprompt engineer']
custom_roles: {}

# Senioridades em que você quer focar o plano (as análises mostram todas).
# Valores: intern, junior, mid, senior, staff_plus
seniority_focus: [intern, junior, mid]
